services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    configs:
      - source: traefik_static
        target: /etc/traefik/traefik.yml
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./diun:/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
    networks:
      - internal

  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    networks:
      - proxy
      - internal
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  warp:
    image: caomingjun/warp
    container_name: warp
    restart: unless-stopped
    privileged: true
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    cap_add:
      - NET_ADMIN
    volumes:
      - /lib/modules:/lib/modules:ro
    networks:
      - internal

  gost:
    image: gogost/gost
    container_name: gost
    restart: unless-stopped
    command: >
      -L=http://:8080
      -F=socks5://warp:1080
    depends_on:
      - warp
    networks:
      - internal

  floppy:
    image: ghcr.io/dannyvfilms/floppy:latest
    container_name: floppy
    restart: unless-stopped
    depends_on:
      floppy-redis:
        condition: service_healthy
    networks:
      - proxy
      - floppy-internal
    env_file:
      - .env.floppy
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - REDIS_URL=redis://floppy-redis:6379
      - FLOPPY_DATA_DIR=/floppy/db
      - BACKUP_DIR=/floppy/backups
      - DB_SNAPSHOT_ENABLED=True
      - URLS=https://floppy.${DOMAIN}
      - ALLOWED_HOSTS=floppy.${DOMAIN}
      - USE_X_FORWARDED=True
      - USE_X_FORWARDED_PROTO=True
      - DEBUG=False
      - DEMO_ACCOUNT_ENABLED=False
      - REGISTRATION=False
    volumes:
      - ./appdata/floppy/db:/floppy/db
      - ./appdata/floppy/backups:/floppy/backups

  floppy-redis:
    image: redis:8-alpine
    container_name: floppy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - floppy-internal
    volumes:
      - ./cache/floppy-redis:/data

networks:
  proxy:
    name: proxy
  internal:
    name: internal
  floppy-internal:
    name: floppy-internal

configs:
  traefik_static:
    content: |
      entryPoints:
        web:
          address: ":80"
          http:
            redirections:
              entrypoint:
                to: websecure
                scheme: https
                permanent: true
        websecure:
          address: ":443"

      providers:
        docker:
          exposedByDefault: false
          network: proxy
        file:
          filename: /etc/traefik/dynamic.yml

      certificatesResolvers:
        letsencrypt:
          acme:
            tlsChallenge: {}
            email: ${ACME_EMAIL}
            storage: /letsencrypt/acme.json

      api:
        dashboard: true
        insecure: false

      ping: {}

      log:
        level: INFO

      accessLog: true

      metrics:
        prometheus: {}

  traefik_dynamic:
    content: |
      http:
        routers:
          dashboard:
            rule: "Host(`dashboard.${DOMAIN}`)"
            entryPoints:
              - websecure
            service: api@internal
            tls:
              certResolver: letsencrypt
            middlewares:
              - dashboard-auth
          
          aiostreams:
            rule: "Host(`aiostreams.${DOMAIN}`)"
            entryPoints:
              - websecure
            service: aiostreams
            tls:
              certResolver: letsencrypt
            # middlewares:
            #  - aiostreams-auth

          floppy:
            rule: "Host(`floppy.${DOMAIN}`)"
            entryPoints:
              - websecure
            service: floppy
            tls:
              certResolver: letsencrypt

        services:
          aiostreams:
            loadBalancer:
              servers:
                - url: "http://aiostreams:3000"

          floppy:
            loadBalancer:
              servers:
                - url: "http://floppy:8000"

        middlewares:
          dashboard-auth:
            basicAuth:
              users:
                - "${DASHBOARD_BASIC_AUTH}"
          aiostreams-auth:
            basicAuth:
              users:
                - "${AIOSTREAMS_BASIC_AUTH}"
